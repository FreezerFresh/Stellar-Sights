<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stellar Sights - Exoplanet Search</title>

  <link rel="stylesheet" href="Stellar Sights - Protype - 10-27-26 - style.css">

  <link rel="stylesheet" href="./UI/home-galaxy.css">
  <link rel="stylesheet" href="./UI/fr06-galaxy.css">
</head>
<body>
    <h1>Stellar Sights</h1>
    <p>
        Search the exoplanet catalog by planet name or host star
    </p>

    <p>
        Use 55 Cnc e or HAT-P- for example (lowercase is fine)
    </p>
      <p>Or search by coordinates by putting 111, 111. Use 133, 28 for example/p>
    <div class="map-button-container">
    <a href="map.html" class="map-link">
        Explore Exoplanet Map
    </a>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter planet name or host star" autocomplete="off">
        <button id="searchBtn">Search</button>
    </div>

    <div id="status" class="status"></div>
    <p> ----------- </p>
    <div id="results"></div>
    
    <section id="transit-section" hidden>
    <h2 id="transit-planet"></h2>

    <label for="event-date">Select transit date:</label>
    <input type="date" id="event-date" value="2026-10-28">

    <div id="transit-results" aria-live="polite"></div>
    </section>

<script src="fr07.js"></script>
<script src="Stellar Sights - Prototype - 10-26-2026 - Javascript.js"></script>
<script src="fr07-integration.js"></script>
<script src="fr06.js"></script>
<script src="fr06-ui.js"></script>
</body>
</html>
